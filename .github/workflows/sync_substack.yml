name: Sincronizzazione Feed Substack

on:
  schedule:
    # Esegui ogni notte alle 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Esegui aggiornamento articoli
        run: |
          python3 site/scripts/fetch_substack.py

      - name: Commit e push se presenti novità
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add site/data/articles.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-sync articoli Substack via RSS" && git push)
